name: Network Exposure Sentinel Scan

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install requests urllib3

      - name: Run Exposure Sentinel
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: .venv/bin/python main.py

      - name: Upload Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exposure-scan-report
          path: logs/