name: Network Exposure Sentinel Scan

on:
  schedule:
    # 13:00 UTC = 9:00 AM EDT (Mondays)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allows manual trigger testing anytime

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Direct package installation (No requirements.txt needed)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Exposure Sentinel Script
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python main.py

      - name: Upload Scan Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exposure-scan-report
          path: logs/